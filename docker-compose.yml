services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: quiz
      MYSQL_USER: quiz
      MYSQL_PASSWORD: quiz
      MYSQL_ROOT_PASSWORD: quiz
    ports:
      - '3307:3306'
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -u quiz -pquiz --silent']
      interval: 5s
      timeout: 3s
      retries: 20

  mysql-test:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: quiz_test
      MYSQL_USER: quiz
      MYSQL_PASSWORD: quiz
      MYSQL_ROOT_PASSWORD: quiz
    ports:
      - '3308:3306'
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -u quiz -pquiz --silent']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql-data:
